name: Apollo deploy image

# Apollo LLM deployment build (branch deploy/apollo only; never released).
# Builds the branch's wheel into a linux/amd64 image and pushes it to GHCR
# under an Apollo-only name. It never publishes to PyPI or GitHub Releases.
# See docs/deploy/apollo.md.

on:
  push:
    branches:
      - deploy/apollo
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: apollo-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/australian-text-analytics-platform/ldaca-wordflow-apollo

jobs:
  image:
    name: Build and push the Apollo image
    if: github.ref == 'refs/heads/deploy/apollo'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with source dependencies
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build and stage frontend
        run: pnpm deploy_frontend_to_backend

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: backend/uv.lock

      - name: Mark the version as an Apollo build
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          python - "${{ github.run_number }}" <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib
          import re
          import sys

          path = pathlib.Path("backend/pyproject.toml")
          text = path.read_text()
          match = re.search(r'^version = "([^"+]+)"$', text, flags=re.MULTILINE)
          if match is None:
              raise SystemExit("backend/pyproject.toml has no plain version")
          version = f"{match.group(1)}+apollo.{sys.argv[1]}"
          path.write_text(text.replace(match.group(0), f'version = "{version}"', 1))
          print(f"python={version}")
          print(f"image={version.replace('+', '-')}")
          PY

      - name: Build the wheel
        working-directory: backend
        run: uv build --no-sources --wheel --out-dir ../dist

      - name: Check the wheel is the Apollo build
        shell: bash
        run: |
          set -Eeuo pipefail
          wheel=$(ls dist/*.whl)
          case "$wheel" in
            *"+apollo.${{ github.run_number }}"*) ;;
            *) echo "::error::Unexpected wheel name $wheel"; exit 1 ;;
          esac
          python -m zipfile -l "$wheel" | grep -q "ldaca_wordflow/apollo_deploy/adapter.py"
          python -m zipfile -l "$wheel" | grep -q "ldaca_wordflow/resources/frontend/build/index.html"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.image }}
            type=sha,format=long
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=LDaCA Wordflow (Apollo deploy build)
            org.opencontainers.image.version=${{ steps.version.outputs.python }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/apollo/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Apollo image"
            echo ""
            echo "- Version: \`${{ steps.version.outputs.python }}\`"
            echo "- Image: \`${{ env.IMAGE }}:${{ steps.version.outputs.image }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
