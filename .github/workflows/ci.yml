name: CI

# CI checks major changes and releases, not every commit. The Scope job decides
# (scripts/ci-scope.mjs): pull requests unless they change only documentation,
# pushes to main, a push to v0.7 or v0.8 with a "Release X.Y.Z" commit or "[ci]"
# in a commit message, and runs by hand (gh workflow run ci.yml --ref <branch>).
# Fix and feature branches are checked through their pull request only.
on:
  push:
    branches:
      - main
      - v0.7
      - v0.8
  pull_request:
  workflow_dispatch:

# A pull request's newer push replaces its running check. Branch pushes never
# cancel each other, so a skipped push cannot cancel a release commit's check.
concurrency:
  group: ldaca-wordflow-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
      backend: ${{ steps.scope.outputs.backend }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test the scope rules
        run: node --test scripts/ci-scope.test.mjs

      - name: Decide what runs
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-scope.mjs

  frontend:
    name: Frontend
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with source dependencies
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run frontend checks
        run: pnpm -C frontend check

      - name: Check engineering documentation links
        run: pnpm docs:links

      - name: Upload compiled frontend
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/build
          if-no-files-found: error
          retention-days: 1

  backend:
    name: Backend ${{ matrix.name }}
    needs: [scope, frontend]
    if: needs.scope.outputs.backend == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - name: Check out repository with source dependencies
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download compiled frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: frontend/build

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Stage frontend for backend packaging
        run: node scripts/deploy-frontend-to-backend.mjs

      - name: Set up Rust nightly for source dependencies
        uses: dtolnay/rust-toolchain@nightly

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: backend/uv.lock

      - name: Synchronize backend from checked-out sources
        working-directory: backend
        run: uv sync --locked

      - name: Run Ruff
        working-directory: backend
        run: uv run --no-sync ruff check .

      - name: Run Ty
        working-directory: backend
        run: uv run --no-sync ty check

      - name: Run pytest
        working-directory: backend
        run: uv run --no-sync pytest -q

      - name: Export OpenAPI without runtime startup
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail
          uv run --no-sync python scripts/export_openapi.py --output "$RUNNER_TEMP/openapi.json"
          uv run --no-sync python - "$RUNNER_TEMP/openapi.json" <<'PY'
          import json
          import pathlib
          import sys

          schema = json.loads(pathlib.Path(sys.argv[1]).read_text())
          operations = [
              operation
              for path in schema["paths"].values()
              for method, operation in path.items()
              if method in {"get", "post", "put", "patch", "delete"}
          ]
          operation_ids = [operation["operationId"] for operation in operations]
          assert len(operation_ids) == len(set(operation_ids))
          assert schema["paths"]["/health/live"]["get"]["responses"]["200"]["content"]
          PY

      - name: Build and inspect backend distributions
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail
          uv build
          uv run --no-sync python ../scripts/verify_backend_distribution.py dist
