name: Promote Tested Wordflow Release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Previous successful Production Wordflow Release Build run ID"
        required: true
        type: string
      release_tag:
        description: "Existing v<version> tag identifying the built source commit"
        required: true
        type: string

concurrency:
  group: wordflow-release-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  promote:
    name: Validate and promote original production packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout the promotion validator
        uses: actions/checkout@v7.0.1

      - name: Inspect the completed production build
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'A numeric build_run_id is required' >&2; exit 1; }
          test "$BUILD_RUN_ID" != "$GITHUB_RUN_ID" || { echo 'Select a previous production build' >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > build-run.json
          jq -e '.path == ".github/workflows/release-build.yml" and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success"' build-run.json >/dev/null
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/artifacts?per_page=100" --jq '.artifacts[]' | jq -s '.' > build-artifacts.json

      - name: Checkout the tagged source for version and signing-key verification
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          path: promotion-source
          fetch-depth: 0

      - name: Download packages from that exact build run
        uses: actions/download-artifact@v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          path: release-artifacts

      - name: Validate identity, completeness, signatures and original bytes
        working-directory: promotion-source
        shell: bash
        run: |
          set -Eeuo pipefail
          node ../scripts/release-artifacts.mjs prepare ../release-artifacts ../release-assets ../build-run.json ../build-artifacts.json "$RELEASE_TAG" "$BUILD_RUN_ID"

      - name: Publish validated original packages
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --latest=false --generate-notes --title "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --latest --repo "$GITHUB_REPOSITORY"
