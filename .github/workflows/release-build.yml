name: Production Wordflow Release Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Source ref to build; defaults to the selected workflow branch"
        required: false
        type: string
        default: ""

concurrency:
  group: wordflow-release-build-${{ inputs.ref != '' && inputs.ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve production source identity
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          fetch-depth: 0
          submodules: recursive
      - name: Resolve the actual checked-out source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check every production version and lock entry
        run: node scripts/check-versions.mjs

  build-desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, macos]
    uses: ./.github/workflows/desktop-build.yml
    secrets: inherit
    with:
      platform: ${{ matrix.platform }}
      debug: false
      ref: ${{ needs.prepare.outputs.sha }}

  build-server:
    needs: prepare
    uses: ./.github/workflows/server-build.yml
    secrets: inherit
    with:
      ref: ${{ needs.prepare.outputs.sha }}
