name: Build server release packages
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read

jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm -C frontend build
      - run: cargo build -p wordflow-server --bin wordflow-server --release --locked --target ${{ matrix.target }}
      - if: runner.os == 'macOS'
        uses: Apple-Actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Audit and package native resources
        run: node scripts/package-server.mjs ${{ matrix.target }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      - name: Notarize macOS server executable
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -Eeuo pipefail
          package="target/server-packages/wordflow-server-aarch64-apple-darwin"
          archive="$RUNNER_TEMP/wordflow-server-notary.zip"
          report="$RUNNER_TEMP/wordflow-server-notary.json"
          ditto -c -k --keepParent "$package" "$archive"
          xcrun notarytool submit "$archive" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --output-format json > "$report"
          jq -e '.status == "Accepted"' "$report" >/dev/null
          spctl --assess --verbose=4 --type execute "$package/wordflow-server"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: wordflow-server-${{ matrix.target }}
          path: |
            target/server-packages/*.tar.gz
            target/server-packages/*.zip
            target/server-packages/*.sha256
          if-no-files-found: error
