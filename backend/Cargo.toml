[package]
name = "wordflow-backend"
version = "8.0.0"
edition = "2024"
publish = false
description = "Shared native Wordflow HTTP runtime"

[dependencies]
hex = "0.4.3"
wordflow-storage = { path = "../storage" }
flate2 = "1.1.10"
sha2 = "0.11.0"
caseless = "0.2.2"
keyring-core = "1.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
ldaca-rs = { path = "../ldaca-rs", features = ["data", "tokenization", "quotation", "topic-modeling", "cache"] }
axum = "0.8.9"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
duckdb = { version = "~1.10506.0", features = ["bundled", "json", "parquet", "vscalar", "vscalar-arrow"] }
regex = "1.13.1"
arrow-ipc = "58.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
tempfile = "3.27.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs"] }
tokio-util = { version = "0.7.19", features = ["rt", "io"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "=6.0.0", features = ["uuid", "axum_extras"] }
utoipa-axum = "=0.3.0"
rust_xlsxwriter = { version = "0.99.1", features = ["constant_memory"] }
calamine = { version = "0.36.1", features = ["dates"] }
apache-avro = "0.21"
quick-xml = "0.42"
arrow-avro = "58.4.0"
parquet = { version = "58.4.0", default-features = false, features = ["arrow", "snap"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
