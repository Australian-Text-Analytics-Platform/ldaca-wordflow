[package]
name = "ldaca-wordflow"
version = "0.7.14"
description = "LDaCA Wordflow Desktop Application"
authors = ["Australian Text Analytics Platform"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
sha2 = "0.10"
tauri-build = { version = "2", features = [] }

[features]
dev-runtime = []

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
# Used by native save commands to fetch large export bodies from the local
# backend and stream them to disk. Bypassing the JS
# fetch body path avoids WebView2 + IPC reliability issues on Windows for
# responses larger than 10 MB.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# The Help menu's search field lists Wordflow's help pages (help_search.rs).
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSObject", "NSString", "NSThread"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSApplication", "NSResponder", "NSUserInterfaceItemSearching"] }
tauri-plugin-liquid-glass = "=0.1.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
