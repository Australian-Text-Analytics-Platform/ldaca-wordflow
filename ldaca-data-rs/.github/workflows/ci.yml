name: SDK checks and wheels
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.14
      - run: uv run --no-sync ruff check ldaca_data_rs tests
      - run: uv run --no-sync ty check ldaca_data_rs
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --out dist -i python
          manylinux: auto
      - shell: bash
        run: |
          uv venv --python python .wheel-test
          uv pip install --python .wheel-test --only-binary=:all: dist/*.whl pytest pytest-asyncio pyarrow polars
      - shell: bash
        run: |
          if [ -f .wheel-test/bin/python ]; then sdk_python=.wheel-test/bin/python; else sdk_python=.wheel-test/Scripts/python.exe; fi
          cd /tmp || cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/$sdk_python" -m pytest -q "$GITHUB_WORKSPACE/tests/python"
      - name: Exercise exports without DataFrame dependencies
        shell: bash
        run: |
          uv venv --python python .core-test
          uv pip install --python .core-test dist/*.whl pytest pytest-asyncio
          if [ -f .core-test/bin/python ]; then sdk_python=.core-test/bin/python; else sdk_python=.core-test/Scripts/python.exe; fi
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/$sdk_python" -m pytest -q -m "not interop" "$GITHUB_WORKSPACE/tests/python"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*.whl
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
      - run: uv build --sdist
      - run: uv venv .sdist-test
      - run: uv pip install --python .sdist-test dist/*.tar.gz pytest pytest-asyncio pyarrow polars
      - run: cd /tmp && "$GITHUB_WORKSPACE/.sdist-test/bin/python" -m pytest -q "$GITHUB_WORKSPACE/tests/python"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
