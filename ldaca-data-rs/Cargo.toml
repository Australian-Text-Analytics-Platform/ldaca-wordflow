[package]
name = "ldaca-data-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Arrow-based ONI data access and RO-Crate tabulation"
repository = "https://github.com/Australian-Text-Analytics-Platform/ldaca-data-rs"

[lib]
name = "ldaca_data_rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3", "dep:pyo3-arrow", "dep:pyo3-async-runtimes"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
arrow-array = "59"
arrow-schema = "59"
arrow-ipc = "59"
arrow-csv = "59"
parquet = { version = "59", default-features = false, features = ["arrow", "snap"] }
futures-util = "0.3"
indexmap = { version = "2", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "stream", "charset", "gzip", "brotli", "deflate", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "io-util", "macros"] }
tokio-util = "0.7"
url = "2"
encoding_rs = "0.8"
pyo3 = { version = "0.29", optional = true }
pyo3-arrow = { version = "0.19", optional = true, default-features = false }
pyo3-async-runtimes = { version = "0.29", optional = true, features = ["tokio-runtime"] }

[dev-dependencies]
axum = "0.8"
proptest = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
