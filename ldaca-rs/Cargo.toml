[package]
name = "ldaca-rs"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Native text analysis and LDaCA data access"

[lib]
name = "ldaca_rs"

[features]
default = []
data = ["dep:arrow-array", "dep:arrow-schema", "dep:arrow-ipc", "dep:arrow-csv", "dep:parquet", "dep:futures-util", "dep:indexmap", "dep:reqwest", "dep:tempfile", "dep:tokio", "dep:tokio-util", "dep:url", "dep:encoding_rs"]
cache = ["dep:duckdb", "dep:fs2", "dep:tempfile"]
tokenization = ["dep:fs2", "dep:hf-hub", "dep:lindera", "dep:tokenizers", "dep:ureq", "dep:zip", "dep:caseless"]
embedding = ["dep:hf-hub", "dep:ndarray", "dep:ort", "dep:tokenizers"]
topic-modeling = ["embedding", "tokenization", "dep:hdbscan", "dep:pacmap", "dep:rmp-serde", "dep:zstd"]
quotation = ["dep:cxx", "dep:cxx-build"]
full = ["data", "tokenization", "embedding", "topic-modeling", "quotation", "cache"]

[dependencies]
cxx = { version = "1", optional = true }
thiserror = { version = "2" }
anyhow = "1.0"
duckdb = { version = "~1.10505.0", features = ["bundled", "json"], optional = true }
fs2 = { version = "0.4", optional = true }
hf-hub = { version = "0.5", default-features = false, features = ["ureq"], optional = true }
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
lindera = { version = "3", default-features = false, features = ["mmap"], optional = true }
regex = "1"
caseless = { version = "0.2.2", optional = true }
serde = { version = "1", features = ["derive"] }
rmp-serde = { version = "1.3", optional = true }
zstd = { version = "0.13", optional = true }
tokenizers = { version = "0.23", default-features = false, features = ["onig"], optional = true }
unicode-segmentation = "1.13.3"
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = { version = "0.10" }
tempfile = { version = "3", optional = true }
pacmap = { version = "0.2", features = ["intel-mkl-static"], optional = true }
ndarray = { version = "0.16", optional = true }
hdbscan = { version = "0.12", optional = true }
arrow-array = { version = "58.4", optional = true }
arrow-schema = { version = "58.4", optional = true }
arrow-ipc = { version = "58.4", optional = true }
arrow-csv = { version = "58.4", optional = true }
parquet = { version = "58.4", default-features = false, features = ["arrow", "snap"], optional = true }
futures-util = { version = "0.3", optional = true }
indexmap = { version = "2", features = ["serde"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "stream", "charset", "gzip", "brotli", "deflate", "system-proxy"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "io-util", "macros"], optional = true }
tokio-util = { version = "0.7", optional = true }
url = { version = "2", optional = true }
encoding_rs = { version = "0.8", optional = true }

[build-dependencies]
cxx-build = { version = "1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native", "api-24", "coreml"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native", "api-24", "directml"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native", "api-24"], optional = true }

[target.'cfg(not(any(target_os = "macos", target_os = "windows", target_os = "linux")))'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native", "api-24"], optional = true }

[dev-dependencies]
ahash = "0.8"
proptest = "1"
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
