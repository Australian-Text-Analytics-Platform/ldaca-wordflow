[package]
name = "ldaca-rs"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Native text analysis and LDaCA data access"

[lib]
name = "ldaca_rs"

[features]
default = []
data = ["dep:arrow-array", "dep:arrow-schema", "dep:arrow-ipc", "dep:arrow-csv", "dep:csv", "dep:parquet", "dep:futures-util", "dep:indexmap", "dep:reqwest", "dep:tempfile", "dep:tokio", "dep:tokio-util", "dep:url", "dep:encoding_rs"]
cache = ["dep:duckdb", "dep:fs2", "dep:tempfile"]
tokenization = ["dep:fs2", "dep:hf-hub", "dep:lindera", "dep:tokenizers", "dep:ureq", "dep:zip", "dep:caseless"]
embedding = ["dep:hf-hub", "dep:ndarray", "dep:ort", "dep:tokenizers"]
topic-modeling = ["embedding", "tokenization", "dep:hdbscan", "dep:rayon", "dep:pacmap", "dep:usearch", "dep:rmp-serde", "dep:zstd"]
quotation = ["dep:cxx", "dep:cxx-build"]
full = ["data", "tokenization", "embedding", "topic-modeling", "quotation", "cache"]

[dependencies]
csv = { version = "1.4.0", optional = true }
hex = "0.4.3"
cxx = { version = "1.0.202", optional = true }
thiserror = { version = "2.0.21" }
anyhow = "1.0.104"
duckdb = { version = "~1.10506.0", features = ["bundled", "json"], optional = true }
fs2 = { version = "0.4.3", optional = true }
hf-hub = { version = "1.0.0", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"], optional = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
lindera = { version = "6.2.0", default-features = false, features = ["mmap"], optional = true }
regex = "1.13.1"
caseless = { version = "0.2.2", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
rmp-serde = { version = "1.3.1", optional = true }
zstd = { version = "0.14.0", optional = true }
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"], optional = true }
unicode-segmentation = "1.13.3"
serde_json = { version = "1.0.151", features = ["preserve_order", "arbitrary_precision"] }
sha2 = { version = "0.11.0" }
tempfile = { version = "3.27.0", optional = true }
pacmap = { version = "0.2.6", features = ["intel-mkl-static"], optional = true }
# PaCMAP requires fp16lib, removed in 2.25; 2.24 fails to compile on Windows.
usearch = { version = "=2.23.0", default-features = false, optional = true }
ndarray = { version = "0.16.1", optional = true }
hdbscan = { version = "0.12.0", features = ["parallel"], optional = true }
rayon = { version = "1.11.0", optional = true }
arrow-array = { version = "58.4.0", optional = true }
arrow-schema = { version = "58.4.0", optional = true }
arrow-ipc = { version = "58.4.0", optional = true }
arrow-csv = { version = "58.4.0", optional = true }
parquet = { version = "58.4.0", default-features = false, features = ["arrow", "snap"], optional = true }
futures-util = { version = "0.3.34", optional = true }
indexmap = { version = "2.14.2", features = ["serde"], optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "stream", "charset", "gzip", "brotli", "deflate", "system-proxy"], optional = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "fs", "io-util", "macros"], optional = true }
tokio-util = { version = "0.7.19", optional = true }
url = { version = "2.5.8", optional = true }
encoding_rs = { version = "0.8.42", optional = true }

[build-dependencies]
cxx-build = { version = "1.0.202", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native", "api-24", "coreml"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native", "api-24", "directml"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native", "api-24"], optional = true }

[target.'cfg(not(any(target_os = "macos", target_os = "windows", target_os = "linux")))'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native", "api-24"], optional = true }

[dev-dependencies]
ahash = "0.8.12"
proptest = "1.11.0"
axum = "0.8.9"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
