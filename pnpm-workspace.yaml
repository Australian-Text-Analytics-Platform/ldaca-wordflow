packages:
  - frontend

allowBuilds:
  '@google/genai': false
  # The embedded Tauri driver does not need standalone browser-driver downloads.
  edgedriver: false
  esbuild: true
  geckodriver: false
  msw: false
  protobufjs: false

peerDependencyRules:
  allowedVersions:
    # echarts-wordcloud 2.1.0 declares ECharts 5, but this exact package pair
    # is verified against the frontend's Vite 8 and ECharts 6.1.0 toolchain.
    'echarts-wordcloud@2.1.0>echarts': '6'
