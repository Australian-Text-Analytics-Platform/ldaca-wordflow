packages:
  - frontend

allowBuilds:
  "@google/genai": false
  # The embedded Tauri driver does not need standalone browser-driver downloads.
  edgedriver: false
  esbuild: true
  geckodriver: false
  msw: false
  protobufjs: false

peerDependencyRules:
  allowedVersions:
    # echarts-wordcloud 2.1.0 declares ECharts 5, but this exact package pair
    # is verified against the frontend's Vite 8 and ECharts 6.1.0 toolchain.
    "echarts-wordcloud@2.1.0>echarts": "6"
    vite: "*"
    vitest: "*"
  allowAny:
    - vite
    - vitest
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.1
  vite-plus: 1.0.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
