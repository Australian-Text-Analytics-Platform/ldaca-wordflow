packages:
  - frontend

allowBuilds:
  '@google/genai': false
  esbuild: true
  msw: false
  protobufjs: false

patchedDependencies:
  echarts-wordcloud@2.1.0: patches/echarts-wordcloud@2.1.0.patch

peerDependencyRules:
  allowedVersions:
    # echarts-wordcloud 2.1.0 declares ECharts 5, but this exact package pair
    # is verified against the frontend's Vite 8 and ECharts 6.1.0 toolchain.
    'echarts-wordcloud@2.1.0>echarts': '6'

overrides:
  # Security fixes for build-time tools whose parents pin an exact vulnerable
  # version even in their latest release. Same major version; drop each entry
  # once the parent moves on.
  # @hey-api/json-schema-ref-parser 1.4.4 (openapi codegen) pins 4.2.0.
  'js-yaml@4.2.0': 4.3.2
  # @tailwindcss/typography 0.5.20 pins 6.0.10.
  'postcss-selector-parser@6.0.10': 6.1.6
  # rehype-katex 7.0.1 and micromark-extension-math 3.1.0 ask for katex ^0.16;
  # use the frontend's own katex (its CSS is already 0.18) and the 0.18.2 fix.
  'katex@<0.18.2': ^0.18.4
