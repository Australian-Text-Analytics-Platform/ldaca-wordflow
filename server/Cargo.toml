[package]
name = "wordflow-server"
version = "8.0.0"
edition = "2024"
publish = false
default-run = "wordflow-server"
description = "Wordflow browser host and native release package"

[dependencies]
hex = "0.4.3"
wordflow-storage = { path = "../storage" }
wordflow-backend = { path = "../backend" }
axum = { version = "0.8.9", features = ["multipart"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
mime_guess = "2.0.5"
rust-embed = { version = "8.12.0", features = ["deterministic-timestamps"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "io-util", "process"] }
tokio-util = { version = "0.7.19", features = ["rt", "io"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "=6.0.0", features = ["uuid", "axum_extras"] }
utoipa-axum = "=0.3.0"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "multipart", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.0"
fs2 = "0.4.3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }
[dev-dependencies]
chrono = "0.4.45"
rsa = "0.9.10"
rand08 = { package = "rand", version = "0.8" }
